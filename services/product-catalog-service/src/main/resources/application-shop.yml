spring:
  datasource:
    url: 'jdbc:mysql://localhost:3306/mss_product_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8'
  flyway:
    enabled: true
    locations: classpath:db/shop
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    config:
      enabled: false
eureka:
  client:
    enabled: false
