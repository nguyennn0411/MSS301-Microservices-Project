server:
  port: 8084

spring:
  application:
    name: order-service

  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_order_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    locations: classpath:db/shop
    baseline-on-migrate: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

payment-service:
  base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8085}
  create-payos-path: ${PAYMENT_SERVICE_CREATE_PAYOS_PATH:/api/payments/payos/create}
  cancel-payos-path: ${PAYMENT_SERVICE_CANCEL_PAYOS_PATH:/api/payments/payos/{orderCode}/cancel}

product-service:
  base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
  validation-path: ${PRODUCT_SERVICE_VALIDATION_PATH:/api/v1/products/validation}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
