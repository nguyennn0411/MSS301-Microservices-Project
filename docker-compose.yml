services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["3306:3306"]
    volumes:
      - ecommerce-mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30
  eureka-server:
    build:
      context: .
      dockerfile: infra/eureka-server/Dockerfile
    ports: ["8761:8761"]
  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    volumes: ["./config-repo:/app/config-repo:ro"]
    ports: ["8888:8888"]
    depends_on: [eureka-server]
  product-catalog-service:
    build:
      context: .
      dockerfile: services/product-catalog-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: shop
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mss_product_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports: ["8082:8082"]
    depends_on:
      mysql: {condition: service_healthy}
      eureka-server: {condition: service_started}
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: shop
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mss_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      PAYOS_ENABLED: ${PAYOS_ENABLED:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:5173/payment/success}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:5173/payment/cancel}
      PAYOS_WEBHOOK_URL: ${PAYOS_WEBHOOK_URL:-}
    ports: ["8085:8085"]
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      eureka-server: {condition: service_started}
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: shop
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mss_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_RABBITMQ_HOST: rabbitmq
      PRODUCT_SERVICE_BASE_URL: http://product-catalog-service:8082
      PAYMENT_SERVICE_BASE_URL: http://payment-service:8085
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports: ["8084:8084"]
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      product-catalog-service: {condition: service_started}
      payment-service: {condition: service_started}
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-before-production-2026}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_user_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports: ["8081:8081"]
    depends_on:
      mysql: {condition: service_healthy}
      eureka-server: {condition: service_started}
  api-gateway:
    build:
      context: .
      dockerfile: infra/api-gateway/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports: ["8080:8080"]
    depends_on: [eureka-server, order-service, payment-service, product-catalog-service]
volumes:
  ecommerce-mysql-data:
